<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>TikTok Downloader - All In One</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        button:focus,
        a:focus,
        input:focus {
            outline: none;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: flex-start;
        }
        .container {
            width: 100%;
            max-width: 450px;
            margin-top: 16px;
        }

        /* Top Navigation Header */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 24px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            border: 1px solid #333333;
            object-fit: cover;
            background: #111111;
        }
        .brand-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #ffffff;
        }
        .btn-install {
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 6px;
        }

        /* Main Downloader Card */
        .card {
            background: #090909;
            border: 1px solid #222222;
            border-radius: 20px;
            padding: 28px 20px;
            text-align: center;
        }
        .main-logo {
            width: 86px;
            height: 86px;
            border-radius: 18px;
            border: 1px solid #333333;
            padding: 6px;
            background: #000000;
            margin-bottom: 18px;
            object-fit: cover;
        }
        h1 {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            color: #ffffff;
            text-transform: uppercase;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #999999;
            margin-bottom: 22px;
            line-height: 1.45;
        }

        /* Input with Clear (X) Button */
        .input-group {
            position: relative;
            margin-bottom: 14px;
        }
        .url-input {
            width: 100%;
            background: #121212;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 14px 42px 14px 14px;
            border-radius: 10px;
            font-size: 0.92rem;
            text-align: center;
        }
        .url-input:focus {
            border-color: #ffffff;
        }
        .clear-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid #3a3a3a;
            background: #1c1c1c;
            color: #ffffff;
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .clear-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn-download {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-download:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Progress Bar */
        .progress-wrapper {
            display: none;
            margin-top: 14px;
            text-align: left;
        }
        .progress-track {
            width: 100%;
            height: 8px;
            background: #181818;
            border: 1px solid #2e2e2e;
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #ffffff;
            transition: width 0.2s ease;
        }
        .progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            font-size: 0.78rem;
            color: #bbbbbb;
        }

        .status-msg {
            margin-top: 10px;
            font-size: 0.82rem;
            color: #bbbbbb;
            min-height: 18px;
        }

        /* Results Area */
        .results-container {
            display: none;
            margin-top: 24px;
            border-top: 1px solid #222222;
            padding-top: 22px;
            text-align: left;
        }
        .post-meta-card {
            background: #101010;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
        }
        .post-top-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 10px;
        }
        .preview-media {
            width: 72px;
            height: 92px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #333333;
            background: #161616;
            flex-shrink: 0;
        }
        .post-info {
            min-width: 0;
            flex: 1;
        }
        .video-desc {
            font-size: 0.86rem;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.35;
            word-break: break-word;
        }
        .author-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #cccccc;
        }
        .author-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #3a3a3a;
            background: #1b1b1b;
            flex-shrink: 0;
        }
        .author-handle {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 600;
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            border-top: 1px solid #222222;
            padding-top: 10px;
            text-align: center;
        }
        .stat-box {
            background: #161616;
            border: 1px solid #252525;
            border-radius: 8px;
            padding: 6px 4px;
        }
        .stat-val {
            font-size: 0.8rem;
            font-weight: 700;
            color: #ffffff;
        }
        .stat-lbl {
            font-size: 0.68rem;
            color: #999999;
            margin-top: 2px;
        }

        .download-options-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #888888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid #333333;
        }
        .option-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-primary-bw {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
        .btn-secondary-bw {
            background: #000000;
            color: #ffffff;
        }

        /* Slideshow Photos & Selection */
        .slideshow-container {
            display: none;
            margin-bottom: 18px;
        }
        .photo-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .select-all-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
        }
        .select-all-label input {
            width: 16px;
            height: 16px;
            accent-color: #ffffff;
            cursor: pointer;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 8px;
        }
        .photo-item {
            position: relative;
            background: #111111;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
        }
        .photo-check {
            position: absolute;
            top: 14px;
            left: 14px;
            width: 18px;
            height: 18px;
            accent-color: #ffffff;
            cursor: pointer;
            z-index: 2;
        }
        .photo-item img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 6px;
        }
        .photo-dl-btn {
            display: block;
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Download Another Video (SnapTik Style) */
        .another-wrap {
            margin-top: 16px;
            text-align: center;
        }
        .btn-another {
            width: 100%;
            background: #0c0c0c;
            color: #cccccc;
            border: 1px solid #333333;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-another:hover {
            border-color: #ffffff;
            color: #ffffff;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .powered-by {
            font-size: 13px;
            font-weight: 600;
            color: #bbbbbb;
            letter-spacing: 0.4px;
        }
        .contact-owner {
            font-size: 11px;
            color: #888888;
            text-decoration: none;
        }
        .contact-owner:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <div class="brand">
            <img src="/icon-512.png" alt="TikTok DL Icon" class="brand-icon" onerror="this.src='/logo.png'">
            <span class="brand-name">TikTok DL</span>
        </div>
        <button type="button" class="btn-install" id="installBtn">Install App</button>
    </div>

    <div class="card">
        <img src="/icon-512.png" alt="TikTok Downloader" class="main-logo" onerror="this.src='/logo.png'">
        <h1>TikTok Downloader</h1>
        <p class="subtitle">Download TikTok Videos (HD / No Watermark), Slideshow Photos & MP3 Audio</p>

        <div class="input-group">
            <input type="url" id="tiktokUrl" class="url-input" placeholder="https://vt.tiktok.com/..." required oninput="toggleClearBtn()">
            <button type="button" id="clearUrlBtn" class="clear-btn" title="Clear link" onclick="clearInputLink()">&times;</button>
        </div>
        <button type="button" onclick="fetchVideoData()" class="btn-download" id="searchBtn">Download Now</button>

        <!-- Progress Bar -->
        <div id="progressWrapper" class="progress-wrapper">
            <div class="progress-track">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <div class="progress-meta">
                <span id="progressLabel">Processing...</span>
                <span id="progressPercent">0%</span>
            </div>
        </div>

        <div id="statusMsg" class="status-msg"></div>

        <div id="results" class="results-container">
            <!-- Post Creator & Engagement Stats (SnapTik Style) -->
            <div class="post-meta-card">
                <div class="post-top-row">
                    <img id="previewImage" src="" alt="Preview" class="preview-media">
                    <div class="post-info">
                        <p id="videoDesc" class="video-desc"></p>
                        <div class="author-row">
                            <img id="authorAvatar" src="" alt="Creator" class="author-avatar" onerror="this.style.display='none'">
                            <span id="authorHandle" class="author-handle">@creator</span>
                        </div>
                    </div>
                </div>
                <div class="stats-row">
                    <div class="stat-box">
                        <div id="statViews" class="stat-val">0</div>
                        <div class="stat-lbl">Views</div>
                    </div>
                    <div class="stat-box">
                        <div id="statLikes" class="stat-val">0</div>
                        <div class="stat-lbl">Likes</div>
                    </div>
                    <div class="stat-box">
                        <div id="statComments" class="stat-val">0</div>
                        <div class="stat-lbl">Comments</div>
                    </div>
                    <div class="stat-box">
                        <div id="statShares" class="stat-val">0</div>
                        <div class="stat-lbl">Shares</div>
                    </div>
                </div>
            </div>

            <!-- Photo Slideshow Selection Section -->
            <div id="photoSlideshow" class="slideshow-container">
                <p class="download-options-title">TikTok Photos Found:</p>
                <div class="photo-toolbar">
                    <label class="select-all-label">
                        <input type="checkbox" id="selectAllPhotos" checked onchange="toggleSelectAllPhotos()">
                        <span>Select All Photos</span>
                    </label>
                </div>
                <div id="photoGrid" class="photo-grid"></div>
            </div>

            <!-- Download Buttons List -->
            <div id="downloadOptions">
                <p class="download-options-title">Select Quality to Download:</p>
                <div class="btn-group">
                    <button type="button" id="dlBulkPhotos" class="option-btn btn-primary-bw" style="display: none;" onclick="downloadSelectedPhotos()">
                        Download All Selected Photos
                    </button>
                    <button type="button" id="dlHdNoWm" class="option-btn btn-primary-bw">
                        Download HD Video (No Watermark)
                    </button>
                    <button type="button" id="dlNoWm" class="option-btn btn-secondary-bw">
                        Download Standard Video (No Watermark)
                    </button>
                    <button type="button" id="dlWm" class="option-btn btn-secondary-bw">
                        Download Watermark Video
                    </button>
                    <button type="button" id="dlAudio" class="option-btn btn-secondary-bw">
                        Download Audio (MP3 / Sound)
                    </button>
                </div>
            </div>

            <!-- Download Another Video -->
            <div class="another-wrap">
                <button type="button" class="btn-another" onclick="resetForAnotherVideo()">
                    Download Another Video
                </button>
            </div>
        </div>

        <div class="footer">
            <div class="powered-by">Powered By Chamidu Dilshan</div>
            <a href="https://t.me/dilshan7878?text=TIK%20TOK%20DL" target="_blank" rel="noopener noreferrer" class="contact-owner">Contact Owner</a>
        </div>
    </div>
</div>

<script>
    // 1. PWA Install Logic
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    function isStandaloneApp() {
        return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    function updateInstallButtonVisibility() {
        if (isStandaloneApp()) {
            installBtn.style.display = 'none';
        } else if (deferredPrompt) {
            installBtn.style.display = 'inline-flex';
        } else {
            installBtn.style.display = 'none';
        }
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        updateInstallButtonVisibility();
    });

    installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (outcome === 'accepted') {
            installBtn.style.display = 'none';
        } else {
            updateInstallButtonVisibility();
        }
    });

    window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        installBtn.style.display = 'none';
    });

    updateInstallButtonVisibility();

    // 2. Input Clear Button Helpers
    function toggleClearBtn() {
        const input = document.getElementById('tiktokUrl');
        const clearBtn = document.getElementById('clearUrlBtn');
        clearBtn.style.display = input.value.trim().length > 0 ? 'flex' : 'none';
    }

    function clearInputLink() {
        const input = document.getElementById('tiktokUrl');
        input.value = '';
        toggleClearBtn();
        input.focus();
    }

    // 3. Progress Bar Helpers
    let progressTimer = null;

    function showProgress(labelText, startPercent = 15) {
        const wrapper = document.getElementById('progressWrapper');
        const fill = document.getElementById('progressFill');
        const label = document.getElementById('progressLabel');
        const percentText = document.getElementById('progressPercent');

        clearInterval(progressTimer);
        wrapper.style.display = 'block';
        let current = startPercent;
        fill.style.width = `${current}%`;
        label.textContent = labelText;
        percentText.textContent = `${current}%`;

        progressTimer = setInterval(() => {
            if (current < 90) {
                current += 5;
                fill.style.width = `${current}%`;
                percentText.textContent = `${current}%`;
            }
        }, 180);
    }

    function setProgressValue(percent, labelText) {
        const fill = document.getElementById('progressFill');
        const label = document.getElementById('progressLabel');
        const percentText = document.getElementById('progressPercent');
        const clamped = Math.max(0, Math.min(100, Math.round(percent)));
        fill.style.width = `${clamped}%`;
        percentText.textContent = `${clamped}%`;
        if (labelText) label.textContent = labelText;
    }

    function finishProgress(labelText = 'Completed') {
        clearInterval(progressTimer);
        setProgressValue(100, labelText);
        setTimeout(() => {
            document.getElementById('progressWrapper').style.display = 'none';
            setProgressValue(0, 'Processing...');
        }, 900);
    }

    function hideProgress() {
        clearInterval(progressTimer);
        document.getElementById('progressWrapper').style.display = 'none';
        setProgressValue(0, 'Processing...');
    }

    // 4. Number Formatting Helper (e.g. 86.3K, 1.2M)
    function formatCount(num) {
        const n = Number(num);
        if (!Number.isFinite(n) || n < 0) return '0';
        if (n >= 1000000) return `${(n / 1000000).toFixed(1).replace(/\.0$/, '')}M`;
        if (n >= 1000) return `${(n / 1000).toFixed(1).replace(/\.0$/, '')}K`;
        return String(n);
    }

    // 5. Direct Blob Download (No New Tab)
    async function triggerDirectDownload(url, filename, btnEl, useOwnProgress = true) {
        const statusMsg = document.getElementById('statusMsg');
        if (!url) return false;

        const originalText = btnEl ? btnEl.textContent : '';
        if (btnEl) {
            btnEl.disabled = true;
            btnEl.textContent = 'Downloading...';
        }
        if (useOwnProgress) {
            showProgress(`Downloading ${filename}...`, 20);
        }
        statusMsg.textContent = `Downloading ${filename}...`;

        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error('Network error');
            if (useOwnProgress) setProgressValue(70, `Saving ${filename}...`);
            const blob = await res.blob();
            const blobUrl = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();

            setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
            if (useOwnProgress) finishProgress('Download started');
            statusMsg.textContent = 'Download started.';
            return true;
        } catch (err) {
            if (useOwnProgress) hideProgress();
            statusMsg.textContent = 'Direct download blocked by server; opening file link to save.';
            window.location.href = url;
            return false;
        } finally {
            if (btnEl) {
                btnEl.disabled = false;
                btnEl.textContent = originalText;
            }
        }
    }

    // 6. Photo Bulk Select & Download
    function toggleSelectAllPhotos() {
        const master = document.getElementById('selectAllPhotos');
        const checks = document.querySelectorAll('.photo-check');
        checks.forEach((chk) => {
            chk.checked = master.checked;
        });
        updateSelectedCountLabel();
    }

    function updateSelectedCountLabel() {
        const checks = Array.from(document.querySelectorAll('.photo-check'));
        if (checks.length === 0) return;
        const selectedCount = checks.filter((c) => c.checked).length;
        const master = document.getElementById('selectAllPhotos');
        const bulkBtn = document.getElementById('dlBulkPhotos');

        if (master) {
            master.checked = selectedCount === checks.length;
        }
        if (bulkBtn) {
            bulkBtn.textContent = `Download All Selected Photos (${selectedCount})`;
            bulkBtn.disabled = selectedCount === 0;
        }
    }

    async function downloadSelectedPhotos() {
        const checks = Array.from(document.querySelectorAll('.photo-check')).filter((c) => c.checked);
        const statusMsg = document.getElementById('statusMsg');
        const bulkBtn = document.getElementById('dlBulkPhotos');

        if (checks.length === 0) {
            statusMsg.textContent = 'Please select at least one photo.';
            return;
        }

        bulkBtn.disabled = true;
        showProgress(`Downloading ${checks.length} photos...`, 5);

        for (let i = 0; i < checks.length; i++) {
            const imgUrl = checks[i].dataset.url;
            const photoNum = checks[i].dataset.index;
            const pct = Math.round(((i + 1) / checks.length) * 95);
            setProgressValue(pct, `Photo ${i + 1} of ${checks.length}...`);
            await triggerDirectDownload(imgUrl, `tiktok-photo-${photoNum}.jpg`, null, false);
            await new Promise((r) => setTimeout(r, 250));
        }

        finishProgress('Selected photos processed');
        statusMsg.textContent = `${checks.length} selected photos processed.`;
        updateSelectedCountLabel();
    }

    // 7. Reset for Another Video
    function resetForAnotherVideo() {
        document.getElementById('results').style.display = 'none';
        document.getElementById('statusMsg').textContent = '';
        hideProgress();
        const input = document.getElementById('tiktokUrl');
        input.value = '';
        toggleClearBtn();
        input.focus();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 8. TikTok Video, Photo & Audio Fetch Logic
    async function fetchVideoData() {
        const urlInput = document.getElementById('tiktokUrl');
        const url = urlInput.value.trim();
        const searchBtn = document.getElementById('searchBtn');
        const statusMsg = document.getElementById('statusMsg');
        const resultsEl = document.getElementById('results');

        if (!url || !url.includes('tiktok.com')) {
            statusMsg.textContent = 'Please enter a valid TikTok URL.';
            return;
        }

        searchBtn.disabled = true;
        searchBtn.textContent = 'Fetching...';
        statusMsg.textContent = 'Fetching media details...';
        resultsEl.style.display = 'none';
        showProgress('Fetching TikTok details...', 15);

        try {
            const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`;
            const response = await fetch(apiUrl);
            setProgressValue(65, 'Parsing media links...');
            const json = await response.json();

            if (!json || json.code !== 0 || !json.data) {
                throw new Error(json && json.msg ? json.msg : 'Data fetch failed');
            }

            const data = json.data;
            const author = data.author || {};
            const rawUsername = author.unique_id || author.id || 'creator';
            const displayAuthor = rawUsername.startsWith('@') ? rawUsername : `@${rawUsername}`;

            document.getElementById('previewImage').src = data.cover || data.origin_cover || '/icon-512.png';
            document.getElementById('videoDesc').textContent = data.title || 'TikTok Media';

            const avatarEl = document.getElementById('authorAvatar');
            if (author.avatar) {
                avatarEl.src = author.avatar;
                avatarEl.style.display = 'block';
            } else {
                avatarEl.style.display = 'none';
            }
            document.getElementById('authorHandle').textContent = author.nickname
                ? `${author.nickname} (${displayAuthor})`
                : displayAuthor;

            document.getElementById('statViews').textContent = formatCount(data.play_count);
            document.getElementById('statLikes').textContent = formatCount(data.digg_count);
            document.getElementById('statComments').textContent = formatCount(data.comment_count);
            document.getElementById('statShares').textContent = formatCount(data.share_count);

            const slideshowEl = document.getElementById('photoSlideshow');
            const photoGridEl = document.getElementById('photoGrid');
            const bulkPhotosBtn = document.getElementById('dlBulkPhotos');

            if (Array.isArray(data.images) && data.images.length > 0) {
                slideshowEl.style.display = 'block';
                bulkPhotosBtn.style.display = 'flex';
                photoGridEl.innerHTML = '';
                data.images.forEach((imgUrl, idx) => {
                    const photoIndex = idx + 1;
                    const div = document.createElement('div');
                    div.className = 'photo-item';

                    const chk = document.createElement('input');
                    chk.type = 'checkbox';
                    chk.className = 'photo-check';
                    chk.checked = true;
                    chk.dataset.url = imgUrl;
                    chk.dataset.index = String(photoIndex);
                    chk.onchange = updateSelectedCountLabel;

                    const img = document.createElement('img');
                    img.src = imgUrl;
                    img.alt = `Photo ${photoIndex}`;

                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'photo-dl-btn';
                    btn.textContent = `Download Photo ${photoIndex}`;
                    btn.onclick = () => triggerDirectDownload(imgUrl, `tiktok-photo-${photoIndex}.jpg`, btn, true);

                    div.appendChild(chk);
                    div.appendChild(img);
                    div.appendChild(btn);
                    photoGridEl.appendChild(div);
                });
                updateSelectedCountLabel();
            } else {
                slideshowEl.style.display = 'none';
                bulkPhotosBtn.style.display = 'none';
                photoGridEl.innerHTML = '';
            }

            const noWmUrl = data.play || '';
            const hdUrl = data.hdplay || data.play || '';
            const wmUrl = data.wmplay || data.play || '';
            const audioUrl = data.music || '';

            bindDownloadBtn('dlHdNoWm', hdUrl, 'tiktok-hd.mp4');
            bindDownloadBtn('dlNoWm', noWmUrl, 'tiktok-no-watermark.mp4');
            bindDownloadBtn('dlWm', wmUrl, 'tiktok-watermark.mp4');
            bindDownloadBtn('dlAudio', audioUrl, 'tiktok-audio.mp3');

            finishProgress('Media ready');
            resultsEl.style.display = 'block';
            statusMsg.textContent = '';
            resultsEl.scrollIntoView({ behavior: 'smooth' });
        } catch (err) {
            hideProgress();
            statusMsg.textContent = 'Unable to fetch download links. Check if the link is public and try again.';
        } finally {
            searchBtn.disabled = false;
            searchBtn.textContent = 'Download Now';
        }
    }

    function bindDownloadBtn(id, url, filename) {
        const btn = document.getElementById(id);
        if (!btn) return;
        if (url) {
            btn.style.display = 'flex';
            btn.onclick = () => triggerDirectDownload(url, filename, btn, true);
        } else {
            btn.style.display = 'none';
        }
    }
</script>

</body>
</html>
